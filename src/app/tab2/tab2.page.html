<ion-header>
  <ion-toolbar>
    <ion-title>Historie</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar 
      placeholder="Hledat podle názvu..." 
      (ionInput)="searchQuery.set($event.detail.value || '')">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-item>
    <ion-select 
      label="Řadit podle:" 
      [value]="sortOption()" 
      (ionChange)="sortOption.set($event.detail.value)">
      <ion-select-option value="name">Názvu (A-Z)</ion-select-option>
      <ion-select-option value="value">Hodnoty (Sestupně)</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item color="light">
    <ion-label>
      <strong>Celkový součet:</strong>
    </ion-label>
    <ion-note slot="end" color="primary">
      <strong>{{ totalSum() }}</strong>
    </ion-note>
  </ion-item>

  <ion-list>
    @for (counter of processedCounters(); track counter.id) {
      <ion-item>
        <ion-label>
          <h2>{{ counter.name }}</h2>
          <p>{{ counter.createdAt | date:'short' }}</p>
        </ion-label>
        
        <ion-note slot="end" color="primary">{{ counter.value }}</ion-note>
        
        <ion-button fill="clear" color="danger" slot="end" (click)="remove(counter.id)">
          Smazat
        </ion-button>
      </ion-item>
    } @empty {
      <ion-item>
        <ion-label class="ion-text-center">Žádná historie</ion-label>
      </ion-item>
    }
  </ion-list>

  @if (totalSum() > 0) {
    <div class="ion-padding">
      <ion-button expand="block" color="danger" (click)="confirmClear()">
        Vymazat historii
      </ion-button>
    </div>
  }

</ion-content>
